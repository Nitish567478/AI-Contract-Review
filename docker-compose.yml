version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: contract-review-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=contract_review

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: contract-review-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:3000
      - MONGODB_URI=mongodb://mongodb:27017/contract_review
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_CHAT_MODEL=${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      - DEV_MOCK_AUTH=${DEV_MOCK_AUTH:-false}
    depends_on:
      - mongodb
    volumes:
      - server_uploads:/app/uploads

volumes:
  mongo_data:
  server_uploads:
